name: Update listening data

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours (UTC); GitHub may run it a bit late
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write            # lets the job commit the refreshed data

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull scrobbles and rebuild weekly data
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}
        run: |
          python collector/collect_lastfm.py
          python collector/aggregate.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly/weekly.json data/artist_tags.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update listening data"
            git pull --rebase
            git push
          fi